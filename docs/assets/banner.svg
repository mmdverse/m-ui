<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="M-UI — anti-censorship VPN panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- wordmark -->
  <g>
    <rect x="80" y="86" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M94 128V100l14 16 14-16v28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="156" y="130" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="6" fill="#f5f5f5">M-UI</text>

  <text x="80" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="17" letter-spacing="2.4" fill="#a1a1aa">SELF-HOSTED VPN &amp; SERVER PANEL · ANTI-CENSORSHIP ENGINE</text>

  <rect x="80" y="200" width="1040" height="1" fill="url(#fade)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b8b93">
    <text x="80" y="238">11 COUNTRIES</text>
    <text x="250" y="238">18 FILTERING LAYERS</text>
    <text x="470" y="238">15 BYPASS PLANS</text>
    <text x="680" y="238">DPI SIMULATOR</text>
    <text x="880" y="238">REAL-XRAY LAB</text>
  </g>

  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="232" cy="233" r="2.4"/><circle cx="452" cy="233" r="2.4"/>
    <circle cx="662" cy="233" r="2.4"/><circle cx="862" cy="233" r="2.4"/>
  </g>

  <text x="80" y="282" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="13" fill="#6b6b73">REALITY · XHTTP · Vision + finalmask · WireGuard / AmneziaWG · multi-hop transit</text>

  <rect x="80" y="60" width="3" height="204" fill="#ffffff" fill-opacity="0.18"/>
</svg>

version: "3.9"
services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/mui
      # required — the app refuses to start in production without it
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # only used to seed the first admin (no users yet); min 8 chars
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
    depends_on: [mongo]
    restart: unless-stopped
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    restart: unless-stopped
volumes: { mongo_data: }
